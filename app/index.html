<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Picks</title>
<style>
:root {
  --bg: #000; --surface: #1C1C1E; --surface-2: #2C2C2E; --note: #3A3A3C;
  --label: #FFF; --label-2: rgba(235,235,245,.6); --label-3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.65); --yours: #FFD60A;
  --font: -apple-system, "SF Pro Text", "SF Pro", system-ui, sans-serif;
  --top: env(safe-area-inset-top); --bottom: env(safe-area-inset-bottom);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); color: var(--label); overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; font: 15px/20px var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.app { height: 100dvh; display: flex; flex-direction: column; padding-top: var(--top); }
main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; display: none; flex-direction: column; }
.view.on { display: flex; }
.y { color: var(--yours); font-weight: 600; }
.sec2 { color: var(--label-2); } .sec3 { color: var(--label-3); }

/* header */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 12px 16px 12px; flex-shrink: 0; }
.head h1 { font: 900 30px/34px var(--font); letter-spacing: -.01em; text-transform: uppercase; }
.head .sub { color: var(--label-2); font-size: 15px; line-height: 20px; }
.who { color: var(--label); font-weight: 600; }
.who::after { content: " ⇄"; color: var(--label-3); font-weight: 400; }
.round { width: 44px; height: 44px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; flex-shrink: 0; }
.round.on { background: var(--yours); }
.round.on svg * { stroke: #000; }

/* deck */
.deck { flex: 1; min-height: 0; position: relative; margin: 0 16px; }
.card { position: absolute; inset: 0; background: var(--surface); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column;
  touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform; transform-origin: 50% 85%; }
.card.under { transform: scale(.96); filter: brightness(.55); pointer-events: none; }
.hero { position: relative; flex-shrink: 0; touch-action: none; height: 150px; background: var(--surface-2) center 25% / cover; display: flex; flex-direction: column; justify-content: flex-end; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(28,28,30,0) 35%, rgba(28,28,30,.92) 88%, var(--surface)); }
.hero .t { position: relative; padding: 0 16px 4px; display: flex; flex-direction: column; gap: 4px; }
.title { font: 900 30px/32px var(--font); letter-spacing: -.01em; text-transform: uppercase; overflow-wrap: anywhere; }
.trailer { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 12px;
  border-radius: 999px; background: rgba(0,0,0,.6); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); font-weight: 600; font-size: 15px; }
.body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 10px 16px 0; display: flex; flex-direction: column; gap: 12px; }
.body > * { flex-shrink: 0; }
.quick { font-size: 15px; line-height: 20px; color: var(--label-2); } .quick b { color: var(--label); font-weight: 600; }
.lead { font-size: 17px; line-height: 23px; letter-spacing: -.02em; }
.facts b { font-weight: 600; }
.scores { display: flex; gap: 14px; padding-top: 6px; flex-wrap: wrap; }
.scores div { font-size: 13px; line-height: 18px; color: var(--label-2); }
.scores b { display: block; color: var(--label); font-size: 15px; font-weight: 700; }
.cap { font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: .04em; color: var(--label-2); text-transform: uppercase; }
.more { flex-shrink: 0; display: flex; margin-top: auto; align-items: center; justify-content: center; gap: 6px; padding: 6px 16px 12px; color: var(--label-3); font-size: 13px; line-height: 18px; }
.notechip { align-self: flex-start; background: var(--note); border-radius: 6px; padding: 4px 8px; font-size: 13px; line-height: 18px; color: var(--label); }
.stamp { position: absolute; z-index: 3; top: 50%; left: 50%; padding: 10px 20px; border-radius: 999px; font: 700 20px/24px var(--font);
  opacity: 0; pointer-events: none; transform: translate(-50%,-50%); white-space: nowrap; }
.stamp.r { background: var(--label); color: #000; }
.stamp.l, .stamp.u { background: var(--surface-2); color: var(--label); border: 1px solid rgba(255,255,255,.2); }

/* answer bar */
.bar { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
.pill { height: 50px; border-radius: 999px; background: var(--surface-2); display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 17px; line-height: 22px; padding: 0 18px; white-space: nowrap; }
.pill.grow { flex: 1; }
.pill.white { background: var(--label); color: #000; font-weight: 700; padding: 0 24px; }
.pill.yellow { background: var(--yours); color: #000; font-weight: 700; }
.pill.outline { background: none; border: 1.5px solid var(--surface-2); }
.pill.tight { padding: 0 6px; font-size: 16px; }
.pill.undo { width: 50px; padding: 0; flex-shrink: 0; }
.pill:disabled { opacity: .35; }
.hint { flex-shrink: 0; text-align: center; color: var(--label-3); font-size: 12px; line-height: 16px; padding: 8px 16px 0; }

/* tabs */
.tabs { flex-shrink: 0; padding: 8px 24px max(10px, var(--bottom)); }
.tabs nav { display: flex; height: 62px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1px solid rgba(255,255,255,.08); }
.tabs button { flex: 1; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 11px; line-height: 14px; font-weight: 600; color: var(--label-2); }
.tabs button svg * { stroke: rgba(235,235,245,.6); }
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--label); }
.tabs button[aria-selected="true"] svg * { stroke: #fff; }
.tabs .count { color: var(--yours); }

/* full view */
.full { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; }
.full .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; }
.full .hero { height: 360px; background-position: center 20%; }
.full .hero::before { background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 50%, #000 100%); }
.full .hero .t { padding: 0 16px 8px; }
.back { position: absolute; top: calc(var(--top) + 10px); left: 12px; z-index: 2; }
.full .trailer { top: calc(var(--top) + 15px); }
.blk { padding: 22px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.blk .quick { font-size: 15px; line-height: 20px; color: var(--label-2); } .quick b { color: var(--label); font-weight: 600; }
.lead { font-size: 17px; line-height: 23px; }
.rows > div { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--sep); }
.rows > div:last-child { border-bottom: 0; }
.rows .k { width: 92px; flex-shrink: 0; color: var(--label-2); }
.rows .v { flex: 1; } .rows .v b { font-weight: 600; }
.sub-h { font-size: 17px; line-height: 22px; font-weight: 600; margin-top: 6px; }
.chart { display: flex; gap: 14px; align-items: flex-end; height: 120px; border-bottom: 1px solid var(--sep); margin-top: 8px; }
.season { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; }
.season .avg { font-size: 13px; line-height: 18px; color: var(--label-2); margin-bottom: 6px; white-space: nowrap; }
.season .avg b { color: var(--label); }
.season .bars { display: flex; align-items: flex-end; gap: 2px; height: 90px; }
.season .bars i { flex: 1; min-width: 1px; max-width: 26px; background: #B4B4B4; border-radius: 3px 3px 0 0; }
.season .bars i.best { background: #FFF; }
.slabels { display: flex; gap: 14px; color: var(--label-2); font-size: 13px; }
.person { display: flex; gap: 14px; align-items: center; padding: 4px 0; }
.ini { width: 44px; height: 44px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; font-weight: 600; color: var(--label-2); flex-shrink: 0; }
.person .n { font-weight: 600; } .person .r { color: var(--label-2); font-weight: 400; }
.person .kf { color: var(--label-2); font-size: 13px; line-height: 18px; }
.near > div { display: flex; align-items: center; gap: 10px; height: 36px; border-bottom: 1px solid var(--sep); }
.near > div:last-child { border-bottom: 0; }
.near .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.near .fl { font-size: 12px; color: var(--label-2); white-space: nowrap; }
.near .bw { width: 80px; flex-shrink: 0; } .near .bw i { display: block; height: 6px; border-radius: 3px; background: rgba(255,255,255,.4); }
.near .yours .bw i { background: var(--yours); }
.box { background: var(--surface); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.full .footer { flex-shrink: 0; background: var(--bg); padding-bottom: max(12px, var(--bottom)); border-top: 1px solid rgba(255,255,255,.06); }

/* seen deck */
.progress { height: 4px; border-radius: 2px; background: var(--surface-2); margin: 0 16px; overflow: hidden; flex-shrink: 0; }
.progress i { display: block; height: 100%; background: var(--yours); }
.skip { color: var(--label-2); font-size: 15px; padding: 8px 0 0 8px; }
.scard { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
  touch-action: none; user-select: none; -webkit-user-select: none; padding: 12px 8px 0; }
.scard .poster { width: min(196px, 50vw); flex-shrink: 1; min-height: 120px; aspect-ratio: 2/3; border-radius: 16px; background: var(--surface) center / cover; }
.scard .title { font-size: 30px; line-height: 34px; margin-top: 12px; }
.scard .what { font-size: 17px; line-height: 21px; max-width: 360px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.seenbar { flex-shrink: 0; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.seenbar .row { display: flex; gap: 8px; } .seenbar .row .pill { flex: 1; padding: 0 8px; }

/* lists */
.list { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 0 16px 24px; }
.seg { display: flex; padding: 3px; border-radius: 999px; background: var(--surface-2); margin: 4px 0 10px; }
.seg button { flex: 1; height: 36px; border-radius: 999px; color: var(--label-2); font-weight: 600; font-size: 15px; }
.seg button[aria-pressed="true"] { background: #636366; color: var(--label); }
.group { margin-top: 22px; }
.group > .cap.yours { color: var(--yours); }
.item { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--sep); width: 100%; text-align: left; }
.item:last-child { border-bottom: 0; }
.item .thumb { width: 48px; aspect-ratio: 2/3; border-radius: 8px; background: var(--surface) center / cover; flex-shrink: 0; }
.item .mid { flex: 1; min-width: 0; }
.item h4 { font-size: 20px; line-height: 25px; font-weight: 600; }
.item .m { color: var(--label-2); font-size: 15px; line-height: 19px; }
.item q { display: block; quotes: none; color: var(--label); font-size: 13px; line-height: 18px; margin-top: 2px; }
.item .side { color: var(--label-2); font-size: 13px; line-height: 18px; text-align: right; width: 72px; flex-shrink: 0; }
.empty { margin: 48px 24px; text-align: center; color: var(--label-2); }
.empty h3 { color: var(--label); font-size: 20px; line-height: 25px; margin-bottom: 6px; }
.shelf { margin-top: 12px; }
.shelf h3 { font-size: 17px; line-height: 22px; font-weight: 700; }
.shelf .ex { color: var(--yours); font-weight: 600; font-size: 15px; line-height: 21px; }
.shelf p { color: var(--label-2); font-size: 13px; line-height: 18px; }
.away { margin-top: 4px; } .away div { padding: 9px 0; border-bottom: 1px solid var(--sep); color: var(--label-3); text-decoration: line-through; }

/* toast and note sheet */
.toast { position: absolute; left: 16px; right: 16px; top: 4px; z-index: 10; background: var(--note); border-radius: 14px; padding: 10px 14px;
  font-size: 15px; line-height: 20px; transform: translateY(-140%); transition: transform .25s; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
.toast.on { transform: none; }
.why { position: absolute; left: 12px; right: 12px; z-index: 11; background: var(--note); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.7); }
.why-t { font-size: 15px; line-height: 20px; font-weight: 600; padding: 0 4px; }
.why-b { display: flex; gap: 8px; } .why-b .pill { background: var(--surface-2); }
.why-h { font-size: 12px; line-height: 16px; color: var(--label-2); padding: 0 4px; }
.notesheet { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: flex; flex-direction: column; justify-content: flex-end; }
.notesheet .panel { background: var(--surface); border-radius: 22px 22px 0 0; padding: 16px 16px max(16px, var(--bottom)); display: flex; flex-direction: column; gap: 10px; }
.notesheet textarea { -webkit-user-select: text; user-select: text; width: 100%; min-height: 110px; resize: none; background: var(--bg); color: var(--label); border: 1px solid var(--surface-2); border-radius: 14px;
  padding: 12px; font: 17px/23px var(--font); }
.notesheet textarea:focus { outline: none; border-color: var(--yours); }
.notesheet .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div class="app">
  <main>
    <section class="view" id="v-picks">
      <div class="head">
        <div><h1>Picks</h1><div class="sub" id="picks-sub"></div></div>
        <button class="round" id="mic" aria-label="Add a note">
          <svg width="18" height="22" viewBox="0 0 18 22"><rect x="5" y="1" width="8" height="13" rx="4" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/><path d="M1.5 10a7.5 7.5 0 0 0 15 0M9 17.5V21" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="deck" id="deck"></div>
      <div class="bar" id="bar-picks">
        <button class="pill undo" data-a="undo" aria-label="Undo">${UNDO}</button>
        <button class="pill grow" data-a="not_for_me">Not for me</button>
        <button class="pill" data-a="seen">Seen it</button>
        <button class="pill white" data-a="want">Want</button>
      </div>
      <div class="bar" id="bar-seen-choice" hidden>
        <button class="pill undo" data-a="back" aria-label="Back">✕</button>
        <button class="pill yellow grow tight" data-a="seen_loved">Loved it</button>
        <button class="pill grow tight" data-a="seen_fine">It was fine</button>
        <button class="pill grow tight" data-a="seen_disliked">Disliked</button>
      </div>
      <div class="hint" id="hint-picks">→ want · ← no, then why (optional) · picture ↑ don&#39;t know</div>
    </section>

    <section class="view" id="v-seen">
      <div class="head" style="padding-bottom:10px">
        <div><h1>Seen it?</h1><div class="sub" id="seen-sub"></div></div>
        <button class="skip" id="skip">Skip</button>
      </div>
      <div class="progress"><i id="seen-progress"></i></div>
      <div class="deck" id="sdeck" style="margin:0"></div>
      <div class="seenbar" id="bar-seen">
        <div class="row">
          <button class="pill yellow" data-a="seen_loved">Loved it</button>
          <button class="pill" data-a="seen_fine">It was fine</button>
          <button class="pill" data-a="seen_disliked">Disliked</button>
        </div>
        <div class="row">
          <button class="pill undo" style="flex:0 0 50px" data-a="undo" aria-label="Undo">${UNDO}</button>
          <button class="pill outline" data-a="dont_know">Not seen it</button>
        </div>
      </div>
      <div class="hint">→ seen, it was fine · ← not seen it</div>
    </section>

    <section class="view" id="v-watch">
      <div class="head"><div><h1>To watch</h1><div class="sub" id="watch-sub"></div></div></div>
      <div class="list" id="watch"></div>
    </section>

    <section class="view" id="v-taste">
      <div class="head"><div><h1>Taste</h1><div class="sub" id="taste-sub"></div></div></div>
      <div class="list" id="taste"></div>
    </section>

    <div class="toast" id="toast"></div>
    <div class="why" id="why" hidden>
      <div class="why-t"><span id="why-title"></span><span class="sec2"> Why? Optional.</span></div>
      <div class="why-b">
        <button class="pill grow tight" data-why="slop">Slop</button>
        <button class="pill grow tight" data-why="not_now">Not right now</button>
        <button class="pill undo" data-why="undo" aria-label="Undo"></button>
      </div>
      <div class="why-h">Slop: bad, and shows like it are bad. Not right now: fine, maybe later. Do nothing: just no.</div>
    </div>
  </main>
  <div class="tabs"><nav role="tablist">
    <button role="tab" data-tab="picks"><svg width="24" height="20" viewBox="0 0 24 20"><rect x="5" y="1" width="14" height="18" rx="3" fill="none" stroke-width="2"/><path d="M1.5 4v12M22.5 4v12" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg>Picks</button>
    <button role="tab" data-tab="seen"><svg width="24" height="20" viewBox="0 0 24 20"><path d="M1 10s4-8 11-8 11 8 11 8-4 8-11 8S1 10 1 10z" fill="none" stroke-width="2"/><circle cx="12" cy="10" r="3.5" fill="none" stroke-width="2"/></svg>Seen it?</button>
    <button role="tab" data-tab="watch"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 1h12v18l-6-4-6 4z" fill="none" stroke-width="2" stroke-linecap="round"/></svg><span>To watch<span class="count" id="watch-count"></span></span></button>
    <button role="tab" data-tab="taste"><svg width="22" height="20" viewBox="0 0 22 20"><circle cx="6" cy="6" r="4.5" fill="none" stroke-width="2"/><circle cx="16" cy="8" r="3.5" fill="none" stroke-width="2"/><circle cx="9" cy="15.5" r="3" fill="none" stroke-width="2"/></svg>Taste</button>
  </nav></div>
</div>

<div class="full" id="full" hidden>
  <div class="scroll" id="full-scroll"></div>
  <div class="footer" id="full-footer"></div>
</div>

<div class="notesheet" id="notesheet" hidden><div class="panel">
  <div class="cap" id="note-for"></div>
  <textarea id="note-text" placeholder="Tap the microphone on the keyboard and talk."></textarea>
  <div class="sec2" style="font-size:13px;line-height:18px">The note goes with your answer to this title.</div>
  <div class="row"><button class="pill" id="note-cancel">Cancel</button><button class="pill white" id="note-save">Keep note</button></div>
</div></div>

<script>
const UNDO = `<svg width="20" height="18" viewBox="0 0 20 18"><path d="M6 1 1.5 5.5 6 10" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 5.5h10a6 6 0 0 1 0 12H8" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
document.querySelectorAll("[data-a=undo]").forEach(b => b.innerHTML = UNDO);
const PLAY = `<svg width="12" height="14" viewBox="0 0 12 14"><path d="M1 1.5v11l10-5.5z" fill="#FFF"/></svg>`;
const SAID = { want: "Want", not_for_me: "Not for me", slop: "Slop", not_now: "Not right now", seen_loved: "Seen: loved it", seen_fine: "Seen: it was fine",
  seen_disliked: "Seen: disliked", dont_know: "Don't know" };
const SEEN_SAID = { ...SAID, dont_know: "Not seen it" };
const SHORT = { "United States of America": "US", "United States": "US", "United Kingdom": "UK" };
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bg = url => url ? `style="background-image:url('${esc(url)}')"` : "";
const small = url => url && url.replace("/t/p/w500/", "/t/p/w185/");
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";
const uniq = a => [...new Set(a)];

let people = [], person, decks = {}, answers = {}, notes = {}, pending = null, tab = localStorage.tab || "picks", filter = "all", skipped = new Set();
const deck = () => decks[person];
const other = () => people.find(p => p !== person);

/* ---------- data ---------- */
async function load() {
  people = await (await fetch("/api/people")).json();
  if (!people.length) { $("#deck").innerHTML = `<div class="empty"><h3>No picks yet</h3>The engine has not written any cards.</div>`; return; }
  person = people.includes(localStorage.person) ? localStorage.person : people[0];
  await Promise.all(people.map(async p => {
    const r = await (await fetch("/api/deck/" + encodeURIComponent(p))).json();
    decks[p] = r.deck; answers[p] = r.answers;
  }));
  render();
}
const find = (d, id) => d.cards.find(c => c.imdb_id === id) || d.seen_deck.find(c => c.imdb_id === id);
const byId = (id, p = person) => find(decks[p], id) || people.map(q => find(decks[q], id)).find(Boolean);
const open = list => list.filter(c => !answers[person][c.imdb_id]);

function commit() {
  if (!pending) return;
  const { item, answer, who } = pending; pending = null; clearTimeout(commit.t); $("#why").hidden = true;
  const body = { person: who, imdb_id: item.imdb_id, answer, note: notes[item.imdb_id] || "" };
  answers[who][item.imdb_id] = body;
  fetch("/api/answer", { method: "POST", keepalive: true, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(r => { if (!r.ok) throw r; })
    .catch(() => { delete answers[who][item.imdb_id]; toast("Not saved: the server did not answer. The title is back in the deck."); render(); });
  render();
}
function answer(item, a, said = SAID) {
  commit();
  pending = { item, answer: a, who: person };
  answers[person][item.imdb_id] = { answer: a, pending: true };
  if (a === "not_for_me") askWhy(item); else toast(`${item.title}: ${said[a]}`);
  commit.t = setTimeout(commit, 8000);
  render();
}
function askWhy(item) {
  const w = $("#why"), bar = $("#bar-picks");
  $("#why-title").textContent = `No to ${item.title}.`;
  $("[data-why=undo]").innerHTML = UNDO;
  w.hidden = false;
  w.style.bottom = tab === "picks" ? `${$("main").offsetHeight - bar.offsetTop + 8}px` : "12px";
}
$("#why").addEventListener("click", e => {
  const r = e.target.closest("[data-why]")?.dataset.why; if (!r || !pending) return;
  if (r === "undo") return undo();
  const title = pending.item.title;
  pending.answer = r; commit(); toast(`${title}: ${SAID[r]}`);
});
function undo() {
  if (!pending) return;
  delete answers[pending.who][pending.item.imdb_id]; pending = null; clearTimeout(commit.t); $("#why").hidden = true;
  toast("Undone"); render();
}
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2500);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) commit(); });
addEventListener("pagehide", commit);

/* ---------- text pieces ---------- */
function years(c) {
  if (c.kind !== "series") return c.year ?? "";
  return c.end_year && c.end_year !== c.year ? `${c.year}–${c.end_year}` : c.end_year ? `${c.year}` : `${c.year}–`;
}
const runtime = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
function metaLine(c) {
  return [c.kind === "series" ? "Series" : "Film", c.made_for?.[0], SHORT[c.country] || c.country, years(c)].filter(Boolean).map(esc).join(" · ");
}
function lengthLine(c) {
  if (c.kind !== "series") return c.runtime_min ? runtime(c.runtime_min) : "";
  return [c.seasons && `${c.seasons} season${c.seasons > 1 ? "s" : ""}`,
    c.episodes && (c.runtime_min ? `${c.episodes} × ${c.runtime_min} min` : `${c.episodes} episodes`),
    c.hours && `about ${c.hours} hour${c.hours > 1 ? "s" : ""}`].filter(Boolean).join(" · ");
}
function statusLine(c) {
  const s = c.status ? cap(c.status.replace(/(\d{4})-(\d\d)-(\d\d)/, (_, y, m, d) => new Date(`${y}-${m}-${d}`).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }))) : "";
  return [s, c.in_library ? "on your Plex" : "not on your Plex"].filter(Boolean).join(" · ");
}
function scoresHTML(c) {
  return [
    c.imdb_rating && `<div><b>${c.imdb_rating.toFixed(1)}</b>IMDb</div>`,
    c.rt_critics != null && `<div><b>${c.rt_critics}%</b>critics</div>`,
    c.rt_audience != null && `<div><b>${c.rt_audience}%</b>audience</div>`,
    c.awards?.length ? `<div><b>${c.awards.length} award${c.awards.length > 1 ? "s" : ""}</b>won</div>` : c.nominations ? `<div><b>${c.nominations}</b>nominations</div>` : "",
  ].filter(Boolean).join("");
}
/* the person's own titles in yellow */
function mark(text, titles) {
  let h = esc(text);
  for (const t of uniq(titles).filter(Boolean).sort((a, b) => b.length - a.length)) h = h.split(esc(t)).join(`<span class="y">${esc(t)}</span>`);
  return h;
}
const yourTitles = c => [...(c.links || []), ...(c.evidence?.links || []).map(l => l.title)];

/* ---------- deck card ---------- */
function quick(c) {
  const len = c.kind === "series" ? c.hours && `${c.hours} h in all` : c.runtime_min && runtime(c.runtime_min);
  const q = [c.imdb_rating && `<b>${c.imdb_rating.toFixed(1)}</b> IMDb`, c.rt_critics != null && `<b>${c.rt_critics}%</b> critics`, len && esc(len)].filter(Boolean);
  return q.length ? `<div class="quick">${q.join(" · ")}</div>` : "";
}
function cardHTML(c) {
  const note = notes[c.imdb_id];
  return `<div class="hero" ${bg(c.art || c.poster)}>
      ${c.trailer ? `<a class="trailer" href="${esc(c.trailer)}" target="_blank" rel="noopener">${PLAY} Trailer</a>` : ""}
      <div class="t"><div class="title">${esc(c.title)}</div><div class="sec2">${metaLine(c)}</div>${quick(c)}</div></div>
    <div class="body">
      ${c.what ? `<div class="lead">${esc(c.what)}</div>` : ""}
      <div class="facts"><b>${esc(lengthLine(c))}</b><div class="sec2">${esc(statusLine(c))}</div>
        <div class="scores">${scoresHTML(c)}</div></div>
      ${note ? `<div class="notechip">Note: ${esc(note)}</div>` : ""}
      ${c.why ? `<div><div class="cap">Why you</div><div>${mark(c.why, yourTitles(c))}</div>
        ${c.why_not ? `<div class="sec2" style="margin-top:4px">Why not: ${esc(c.why_not)}</div>` : ""}</div>` : ""}
      <div class="more"><svg width="12" height="8" viewBox="0 0 12 8"><path d="M1 7l5-5 5 5" fill="none" stroke="rgba(235,235,245,.3)" stroke-width="2" stroke-linecap="round"/></svg>Tap for makers, cast, seasons and similar titles</div>
    </div>
    <div class="stamp r">Want</div><div class="stamp l">Not for me</div><div class="stamp u">Don't know</div>`;
}
function seenHTML(c) {
  const len = c.kind === "series" ? [c.seasons && `${c.seasons} seasons`, c.episodes && `${c.episodes} episodes`].filter(Boolean).join(" · ") : c.runtime_min ? runtime(c.runtime_min) : "";
  return `<div class="poster" ${bg(c.poster)}></div>
    <div class="title">${esc(c.title)}</div>
    <div class="sec2" style="font-size:17px">${[c.kind === "series" ? "Series" : "Film", years(c), len].filter(Boolean).map(esc).join(" · ")}</div>
    ${c.what ? `<div class="what">${esc(c.what)}</div>` : ""}
    <div class="stamp r">Seen, it was fine</div><div class="stamp l">Not seen it</div>`;
}

/* ---------- swipe: the card follows the finger ---------- */
function swipeable(card, under, dirs, onTap) {
  let x0, y0, dx = 0, dy = 0, axis = null, samples = [], id = null, t0, fromHero;
  const W = () => card.offsetWidth, H = () => card.offsetHeight;
  const st = k => $(".stamp." + k, card);
  const place = (x, y, t) => {
    card.style.transition = t || "none";
    card.style.transform = `translate(${x}px, ${y}px) rotate(${x / 20}deg)`;
    if (st("r")) st("r").style.opacity = Math.max(0, Math.min(1, x / 80));
    if (st("l")) st("l").style.opacity = Math.max(0, Math.min(1, -x / 80));
    if (st("u")) st("u").style.opacity = Math.max(0, Math.min(1, -y / 80));
    if (under) { const p = Math.min(1, Math.max(Math.abs(x) / (W() * .4), -y / (H() * .3), 0));
      under.style.transition = t ? "transform .3s, filter .3s" : "none";
      under.style.transform = `scale(${.96 + .04 * p})`; under.style.filter = `brightness(${.55 + .45 * p})`; }
  };
  card.fling = (dir, v = 1.4) => {
    const tx = dir === "up" ? dx : (dir === "right" ? 1 : -1) * W() * 1.4, ty = dir === "up" ? -H() * 1.3 : dy;
    const ms = Math.max(180, Math.min(360, Math.hypot(tx - dx, ty - dy) / v));
    place(tx, ty, `transform ${ms}ms cubic-bezier(.2,.7,.3,1)`);
    setTimeout(() => dirs[dir](), ms - 40);
  };
  card.addEventListener("pointerdown", e => {
    if (e.target.closest("a, button, textarea") || id !== null) return;
    id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = dy = 0; axis = null; t0 = e.timeStamp; samples = [[e.timeStamp, 0, 0]];
    fromHero = !e.target.closest(".body") || !card.classList.contains("card");
  });
  card.addEventListener("pointermove", e => {
    if (e.pointerId !== id) return;
    const mx = e.clientX - x0, my = e.clientY - y0;
    if (!axis) {
      if (Math.hypot(mx, my) < 8) return;
      axis = Math.abs(mx) >= Math.abs(my) ? "x" : (my < 0 && dirs.up && fromHero ? "y" : "none");
      if (axis === "none") { id = null; return; }
      card.setPointerCapture(id);
    }
    dx = axis === "x" ? mx : mx * .25; dy = axis === "y" ? Math.min(0, my) : my * .15;
    samples.push([e.timeStamp, dx, dy]); if (samples.length > 6) samples.shift();
    place(dx, dy);
  });
  const end = e => {
    if (e.pointerId !== id) return; id = null;
    if (!axis) { if (e.type === "pointerup" && e.timeStamp - t0 < 500 && onTap) onTap(); return; }
    const [ta, xa, ya] = samples[0], [tb, xb, yb] = samples[samples.length - 1], dt = Math.max(1, tb - ta);
    const vx = (xb - xa) / dt, vy = (yb - ya) / dt;
    let dir = null;
    if (axis === "x") {
      if (Math.abs(dx) > W() * .3 || (Math.abs(vx) > .45 && Math.sign(vx) === Math.sign(dx))) dir = dx > 0 ? "right" : "left";
    } else if (axis === "y" && (-dy > H() * .22 || (vy < -.45 && dy < 0))) dir = "up";
    if (e.type === "pointerup" && dir) card.fling(dir, Math.max(1.4, Math.hypot(vx, vy)));
    else { place(0, 0, "transform .45s cubic-bezier(.2,1.5,.4,1)"); dx = dy = 0; }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

/* ---------- views ---------- */
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + tab));
  document.querySelectorAll("[data-a=undo]").forEach(b => b.disabled = !pending);
  if (!deck()) return;
  const mine = wantedOf(person);
  $("#watch-count").textContent = mine.length ? ` ${mine.length}` : "";
  ({ picks: renderPicks, seen: renderSeen, watch: renderWatch, taste: renderTaste })[tab]();
}
const whoButton = () => people.length > 1 ? `<button class="who" data-switch>${esc(cap(person))}</button>` : esc(cap(person));

function renderPicks() {
  showSeenChoice(false);
  const items = open(deck().cards), total = deck().cards.length;
  $("#picks-sub").innerHTML = `${items.length ? `${total - items.length + 1} of ${total}` : `${total} of ${total}`} · for ${whoButton()}`;
  const el = $("#deck"); el.innerHTML = "";
  const [top, next] = items;
  $("#bar-picks").style.visibility = $("#hint-picks").style.visibility = top ? "" : "hidden";
  $("#mic").style.visibility = top ? "" : "hidden";
  $("#mic").classList.toggle("on", !!(top && notes[top.imdb_id]));
  if (!top) { el.innerHTML = `<div class="empty"><h3>That's every pick for now</h3>The ones you want wait in To watch. New picks appear here when the engine writes them.</div>`; return; }
  if (next) el.insertAdjacentHTML("beforeend", `<article class="card under">${cardHTML(next)}</article>`);
  el.insertAdjacentHTML("beforeend", `<article class="card">${cardHTML(top)}</article>`);
  if (items[2]) new Image().src = items[2].art || items[2].poster;
  swipeable($(".card:not(.under)", el), $(".card.under", el),
    { right: () => answer(top, "want"), left: () => answer(top, "not_for_me"), up: () => answer(top, "dont_know") },
    () => openFull(top.imdb_id));
}
function showSeenChoice(on) { $("#bar-picks").hidden = on; $("#bar-seen-choice").hidden = !on; }

function renderSeen() {
  const all = deck().seen_deck, items = open(all).sort((a, b) => skipped.has(a.imdb_id) - skipped.has(b.imdb_id));
  const done = all.length - items.length;
  $("#seen-sub").textContent = `On your Plex · ${Math.min(done + 1, all.length)} of ${all.length}`;
  $("#seen-progress").style.width = `${(done / all.length) * 100}%`;
  const el = $("#sdeck"); el.innerHTML = "";
  $("#bar-seen").style.visibility = items[0] ? "" : "hidden";
  if (!items[0]) { el.innerHTML = `<div class="empty"><h3>Library done</h3>Every title here has an answer.</div>`; return; }
  el.insertAdjacentHTML("beforeend", `<div class="scard">${seenHTML(items[0])}</div>`);
  if (items[1]) new Image().src = items[1].poster;
  swipeable($(".scard", el), null,
    { right: () => answer(items[0], "seen_fine", SEEN_SAID), left: () => answer(items[0], "dont_know", SEEN_SAID) });
}

function wantedOf(p) {
  return Object.entries(answers[p] || {}).filter(([, a]) => a.answer === "want").map(([id]) => byId(id, p)).filter(Boolean).reverse();
}
function itemHTML(c, p) {
  const n = answers[p][c.imdb_id]?.note;
  const sub = [c.kind === "series" ? "Series" : "Film", c.made_for?.[0] || c.year,
    c.kind === "series" ? (c.episodes && `${c.episodes} episodes`) : c.runtime_min && runtime(c.runtime_min),
    c.hours && `${c.hours} hours`].filter(Boolean).map(esc).join(" · ");
  const sc = [c.imdb_rating && `${c.imdb_rating.toFixed(1)} IMDb`, c.rt_critics != null && `${c.rt_critics}% critics`].filter(Boolean).join(" · ");
  return `<button class="item" data-open="${esc(c.imdb_id)}" data-p="${esc(p)}"><div class="thumb" ${bg(small(c.poster))}></div>
    <div class="mid"><h4>${esc(c.title)}</h4><div class="m">${sub}</div>${sc ? `<div class="m">${sc}</div>` : ""}${n ? `<q>“${esc(n)}”</q>` : ""}</div>
    <div class="side">${c.in_library ? "On your Plex" : "Not on your Plex"}</div></button>`;
}
function renderWatch() {
  const o = other(), short = c => (c.hours ?? (c.runtime_min || 999) / 60) <= 2;
  const lists = { [person]: wantedOf(person), ...(o ? { [o]: wantedOf(o) } : {}) };
  const keep = (p, c) => (filter === "all" || filter === p || (filter === "short" && short(c)));
  const shown = Object.entries(lists).map(([p, l]) => [p, l.filter(c => keep(p, c))]);
  const n = shown.reduce((s, [, l]) => s + l.length, 0);
  $("#watch-sub").innerHTML = `${n} shown · ${lists[person].length} yours${o ? `, ${lists[o].length} ${esc(cap(o))}'s` : ""} · for ${whoButton()}`;
  const segs = [["all", "Everyone"], [person, "Mine"], ...(o ? [[o, `${cap(o)}'s`]] : []), ["short", "Under 2 h"]];
  $("#watch").innerHTML = `<div class="seg">${segs.map(([k, l]) => `<button data-filter="${esc(k)}" aria-pressed="${filter === k}">${esc(l)}</button>`).join("")}</div>` +
    (n ? shown.filter(([, l]) => l.length).map(([p, l]) => `<div class="group"><div class="cap ${p === person ? "yours" : ""}">${p === person ? "You want" : `${esc(cap(p))} wants`}</div>
      ${l.map(c => itemHTML(c, p)).join("")}</div>`).join("")
      : `<div class="empty"><h3>Nothing here yet</h3>Swipe right or tap Want on a pick and it waits here.</div>`);
}
function renderTaste() {
  const tm = deck().taste_map || { clusters: [] };
  $("#taste-sub").innerHTML = `Shelves of titles the same people love · for ${whoButton()}`;
  $("#taste").innerHTML = tm.clusters.map(s => `<div class="box shelf">
      <h3>${esc(s.name)}</h3>
      ${s.examples?.length ? `<div class="ex">${s.examples.map(t => esc(t.title ?? t)).join(" · ")}</div>` : ""}
      ${s.description ? `<p>${esc(s.description)}</p>` : ""}
      ${s.clusters?.length ? `<p>Where you sit on it: ${s.clusters.map(esc).join(" · ")}</p>` : ""}
      ${s.nearby?.length ? `<p>Also here, not rated by you: ${s.nearby.map(t => esc(t.title ?? t)).join(", ")}</p>` : ""}
      ${s.neighbours?.length ? `<p>Next door: ${s.neighbours.map(esc).join(" · ")}</p>` : ""}
    </div>`).join("") +
    (tm.away_from?.length ? `<div class="group"><div class="cap">Titles you turn away from</div><div class="away">${tm.away_from.map(t => `<div>${esc(t.title ?? t)}</div>`).join("")}</div></div>` : "");
}

/* ---------- full view ---------- */
function knownFrom(k) {
  return uniq((k || []).map(x => x.title + (x.yours === "on your Plex" ? " (on your Plex)" : "") + (x.yours && x.yours !== "on your Plex" ? "\u0000" : ""))).slice(0, 4)
    .map(t => t.endsWith("\u0000") ? `<span class="y">${esc(t.slice(0, -1))}</span>` : esc(t)).join(" · ");
}
function peopleHTML(list, roleFmt) {
  return list.map(m => `<div class="person"><div class="ini">${esc(m.name.split(" ").map(w => w[0]).slice(0, 2).join(""))}</div>
    <div><div><span class="n">${esc(m.name)}</span> <span class="r">${esc(roleFmt(m))}</span></div><div class="kf">${knownFrom(m.known_from)}</div></div></div>`).join("");
}
function chartHTML(c) {
  const s = (c.season_ratings || []).filter(x => x.ratings?.length);
  if (!s.length) return "";
  const all = s.flatMap(x => x.ratings), lo = Math.min(...all) - .6, hi = Math.max(...all);
  let best = { r: -1 }; s.forEach(x => x.ratings.forEach((r, i) => { if (r > best.r) best = { r, s: x.season, e: i + 1 }; }));
  const n = all.length;
  return `<div class="blk"><div class="cap">Does it hold up? IMDb, every episode</div>
    <div class="chart">${s.map(x => `<div class="season" style="flex:${x.ratings.length} 1 0"><div class="avg"><b>${x.average.toFixed(1)}</b> avg</div>
      <div class="bars">${x.ratings.map((r, i) => `<i class="${x.season === best.s && i + 1 === best.e ? "best" : ""}" style="height:${Math.max(4, ((r - lo) / (hi - lo)) * 90)}px"></i>`).join("")}</div></div>`).join("")}</div>
    ${s.length <= 6 ? `<div class="slabels">${s.map(x => `<div style="flex:${x.ratings.length} 1 0;white-space:nowrap;overflow:hidden">Season ${x.season}</div>`).join("")}</div>` : ""}
    <div>Best episode: season ${best.s}, episode ${best.e} (${best.r.toFixed(1)}). ${n} episodes rated.</div></div>`;
}
function fullHTML(c, p) {
  const ev = c.evidence || {}, top = Math.max(...(c.closest || []).map(x => x.closeness), 0.0001);
  const rows = [
    ["Length", `<b>${esc(lengthLine(c))}</b>${c.kind === "series" && c.runtime_min ? `<br>Episodes about ${c.runtime_min} min` : ""}`],
    c.status && ["Status", esc(statusLine(c).split(" · ")[0])],
    ["Where", `${c.made_for?.length ? `Made for ${c.made_for.map(esc).join(", ")}. ` : ""}${c.in_library ? "On your Plex." : "Not on your Plex."}`],
    c.based_on && ["Based on", esc(c.based_on)],
  ].filter(Boolean);
  const audience = (ev.links || []).filter(l => l.how === "shared audience");
  const makersLinks = (ev.links || []).filter(l => l.how === "shared maker");
  const fo = c.for_other;
  return `<div class="hero" ${bg(c.art || c.poster)}>
      <button class="round back" data-close aria-label="Back"><svg width="10" height="18" viewBox="0 0 10 18"><path d="M8.5 1.5 1.5 9l7 7.5" fill="none" stroke="#FFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      ${c.trailer ? `<a class="trailer" href="${esc(c.trailer)}" target="_blank" rel="noopener">${PLAY} Trailer</a>` : ""}
      <div class="t"><div class="title">${esc(c.title)}</div><div class="sec2">${metaLine(c)}</div></div></div>
    ${c.what ? `<div class="blk"><div class="cap">What it is</div><div class="lead">${esc(c.what)}</div></div>` : ""}
    <div class="blk rows" style="gap:0">${rows.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>
    ${c.why ? `<div class="blk"><div class="cap">Why you</div><div>${mark(c.why, yourTitles(c))}</div>
      ${c.makers?.length || makersLinks.length ? `<div class="sub-h">Who made it</div>${makersLinks.map(l => `<div>Shared maker with <span class="y">${esc(l.title)}</span>${l.maker ? `: ${esc(l.maker)}` : ""}.</div>`).join("")}${peopleHTML(c.makers || [], m => m.role || "")}` : ""}
      ${audience.length ? `<div class="sub-h">Who else liked it</div>${audience.map(l => `<div>${l.fans_who_also_loved_it != null ? `${l.fans_who_also_loved_it} of the ${l.fans} fans of <span class="y">${esc(l.title)}</span> in our data also love this.` : `Shares an audience with <span class="y">${esc(l.title)}</span>.`}</div>`).join("")}` : ""}
      ${c.why_not ? `<div class="sub-h">Why not</div><div>${esc(c.why_not)}</div>` : ""}</div>` : ""}
    ${chartHTML(c)}
    ${c.cast?.length ? `<div class="blk"><div class="cap">Who's in it, and where you'd know them from</div>${peopleHTML(c.cast, m => m.role ? `as ${m.role}` : "")}</div>` : ""}
    ${c.closest?.length ? `<div class="blk"><div class="cap">Closest by shared audience</div><div class="sec2" style="font-size:13px">Longer bar: more of the same people love both.</div>
      <div class="near">${c.closest.map(x => `<div class="${x.flag === "you like it" ? "yours" : ""}"><div class="nm"><span class="${x.flag === "you like it" ? "y" : ""}">${esc(x.title)}</span> <span class="sec3">${esc(x.year ?? "")}</span></div>
        ${x.flag ? `<div class="fl">${esc(x.flag)}</div>` : ""}<div class="bw"><i style="width:${Math.max(6, (x.closeness / top) * 76)}px"></i></div></div>`).join("")}</div></div>` : ""}
    <div class="blk"><div class="cap">How good, by other measures</div>
      <div class="scores" style="gap:28px">${[c.imdb_rating && `<div><b style="font-size:28px;line-height:34px">${c.imdb_rating.toFixed(1)}</b>IMDb${c.imdb_votes ? ` · ${c.imdb_votes >= 1000 ? Math.round(c.imdb_votes / 1000) + "k" : c.imdb_votes} votes` : ""}</div>`,
        c.rt_critics != null && `<div><b style="font-size:28px;line-height:34px">${c.rt_critics}%</b>RT critics</div>`,
        c.rt_audience != null && `<div><b style="font-size:28px;line-height:34px">${c.rt_audience}%</b>RT audience</div>`].filter(Boolean).join("")}</div>
      ${c.awards?.length || c.nominations ? `<div>${c.awards?.length ? `Won: ${c.awards.map(esc).join("; ")}. ` : ""}${c.nominations ? `${c.nominations} nominations.` : ""}</div>` : ""}</div>
    ${fo ? `<div class="blk"><div class="cap">For ${esc(cap(fo.name))} too?</div><div class="box">
      <div style="font-weight:600;font-size:17px">${fo.linked_titles?.length ? `${fo.linked_titles.length} of ${esc(cap(fo.name))}'s titles point here` : "Can't tell yet"}</div>
      <div class="sec2">${fo.linked_titles?.length ? `${fo.linked_titles.map(esc).join(", ")}. ` : ""}Based on ${fo.evidence_titles ?? 0} of ${esc(cap(fo.name))}'s own titles.</div></div></div>` : ""}`;
}
function openFull(id, p = person) {
  const c = byId(id, p), a = answers[p][id]?.answer, inDeck = p === person && !a && tab === "picks";
  $("#full-scroll").innerHTML = fullHTML(c, p);
  $("#full-scroll").scrollTop = 0;
  $("#full").dataset.id = id; $("#full").dataset.p = p;
  $("#full-footer").innerHTML = `${a ? `<div class="hint">${p === person ? "Your" : esc(cap(p)) + "'s"} answer now: ${SAID[a]}</div>` : ""}
    <div class="bar" data-full>
      <button class="pill grow" data-a="not_for_me">Not for me</button>
      <button class="pill" data-a="seen">Seen it</button>
      <button class="pill white" data-a="${a === "want" ? "note" : "want"}">${a === "want" ? "Note" : "Want"}</button></div>
    <div class="bar" data-full-seen hidden>
      <button class="pill undo" data-a="back" aria-label="Back">✕</button><button class="pill yellow grow tight" data-a="seen_loved">Loved it</button>
      <button class="pill grow tight" data-a="seen_fine">It was fine</button><button class="pill grow tight" data-a="seen_disliked">Disliked</button></div>
    <div class="hint">${inDeck ? "Answering here moves on to the next pick." : "A new answer replaces the old one."}</div>`;
  $("#full").hidden = false;
}
const closeFull = () => { $("#full").hidden = true; };
$("#full").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeFull();
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, id = $("#full").dataset.id, p = $("#full").dataset.p;
  if (a === "seen" || a === "back") { $("[data-full]").hidden = a === "seen"; $("[data-full-seen]").hidden = a !== "seen"; return; }
  if (a === "note") return openNote(byId(id, p));
  closeFull();
  answer(byId(id, p), a);
});

/* ---------- note ---------- */
function openNote(item) {
  if (!item) return;
  $("#notesheet").dataset.id = item.imdb_id;
  $("#note-for").textContent = `Note on ${item.title}`;
  $("#note-text").value = notes[item.imdb_id] || answers[person][item.imdb_id]?.note || "";
  $("#notesheet").hidden = false; $("#note-text").focus();
}
$("#note-cancel").onclick = () => { $("#notesheet").hidden = true; };
$("#note-save").onclick = () => {
  const id = $("#notesheet").dataset.id, v = $("#note-text").value.trim();
  notes[id] = v; $("#notesheet").hidden = true;
  const a = answers[person][id];
  if (a && !a.pending) { closeFull(); answer(byId(id), a.answer); return; }
  toast(v ? "Note kept. It goes with your answer." : "Note removed."); render();
};
$("#mic").onclick = () => openNote(open(deck().cards)[0]);

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-switch],[data-open],[data-filter]");
  if (!t) return;
  if (t.dataset.tab) { commit(); tab = localStorage.tab = t.dataset.tab; render(); $(".view.on .list")?.scrollTo(0, 0); }
  else if (t.hasAttribute("data-switch")) { commit(); person = localStorage.person = other(); filter = "all"; render(); }
  else if (t.dataset.filter) { filter = t.dataset.filter; render(); }
  else if (t.dataset.open) openFull(t.dataset.open, t.dataset.p);
});
$("#bar-picks").addEventListener("click", e => {
  const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
  if (a === "undo") return undo();
  if (a === "seen") return showSeenChoice(true);
  const card = $("#deck .card:not(.under)"); if (!card) return;
  if (a === "want") card.fling("right"); else if (a === "not_for_me") card.fling("left");
});
$("#bar-seen-choice").addEventListener("click", e => {
  const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
  if (a === "back") return showSeenChoice(false);
  answer(open(deck().cards)[0], a);
});
$("#bar-seen").addEventListener("click", e => {
  const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
  if (a === "undo") return undo();
  const card = $("#sdeck .scard"); if (!card) return;
  if (a === "seen_fine") card.fling("right"); else if (a === "dont_know") card.fling("left");
  else answer(open(deck().seen_deck).sort((x, y) => skipped.has(x.imdb_id) - skipped.has(y.imdb_id))[0], a, SEEN_SAID);
});
$("#skip").onclick = () => {
  const top = open(deck().seen_deck).sort((x, y) => skipped.has(x.imdb_id) - skipped.has(y.imdb_id))[0];
  if (top) { skipped.add(top.imdb_id); render(); }
};
load();
</script>
</body>
</html>
